name: Backend Pytest

on:
  pull_request:
    paths:
      - "core/**"
      - "workers/**"
      - "deploy/**"
      - "tests/**"
      - ".github/workflows/backend-pytest.yml"
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "workers/**"
      - "deploy/**"
      - "tests/**"
      - ".github/workflows/backend-pytest.yml"

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mfa_policy_mode: [off, report, enforce]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: |
          cp deploy/.env.example deploy/.env
          python - <<'PY'
          from pathlib import Path
          from cryptography.fernet import Fernet
          import os
          mode = os.environ["MFA_POLICY_MODE"]
          env = Path("deploy/.env")
          lines = env.read_text().splitlines()
          out = []
          for line in lines:
            if line.startswith("IDENTIFIER_ENCRYPTION_KEY="):
              out.append(f"IDENTIFIER_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
            elif line.startswith("MFA_TOTP_ENCRYPTION_KEY="):
              out.append(f"MFA_TOTP_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
            elif line.startswith("MFA_POLICY_MODE="):
              out.append(f"MFA_POLICY_MODE={mode}")
            else:
              out.append(line)
          env.write_text("\n".join(out) + "\n")
          PY
        env:
          MFA_POLICY_MODE: ${{ matrix.mfa_policy_mode }}

      - name: Start stack
        run: |
          cd deploy
          docker compose up -d --build postgres redis migrate api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Build integration test runner image
        run: |
          cd deploy
          docker compose build integration-tests

      - name: Run integration tests (containerized)
        run: |
          cd deploy
          docker compose run --rm integration-tests

      - name: Dump compose logs on failure
        if: failure()
        run: |
          cd deploy
          docker compose logs --no-color --tail=200

  webauthn-rate-limit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file (low WebAuthn rate limits)
        run: |
          cp deploy/.env.example deploy/.env
          python - <<'PY'
          from pathlib import Path
          from cryptography.fernet import Fernet
          env = Path("deploy/.env")
          lines = env.read_text().splitlines()
          out = []
          for line in lines:
            if line.startswith("IDENTIFIER_ENCRYPTION_KEY="):
              out.append(f"IDENTIFIER_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
            elif line.startswith("MFA_TOTP_ENCRYPTION_KEY="):
              out.append(f"MFA_TOTP_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
            elif line.startswith("RATE_LIMIT_WEBAUTHN_VERIFY_SETUP_MAX_ATTEMPTS="):
              out.append("RATE_LIMIT_WEBAUTHN_VERIFY_SETUP_MAX_ATTEMPTS=3")
            elif line.startswith("RATE_LIMIT_WEBAUTHN_VERIFY_SETUP_WINDOW_SECONDS="):
              out.append("RATE_LIMIT_WEBAUTHN_VERIFY_SETUP_WINDOW_SECONDS=300")
            elif line.startswith("RATE_LIMIT_WEBAUTHN_FINISH_MAX_ATTEMPTS="):
              out.append("RATE_LIMIT_WEBAUTHN_FINISH_MAX_ATTEMPTS=3")
            elif line.startswith("RATE_LIMIT_WEBAUTHN_FINISH_WINDOW_SECONDS="):
              out.append("RATE_LIMIT_WEBAUTHN_FINISH_WINDOW_SECONDS=300")
            else:
              out.append(line)
          env.write_text("\n".join(out) + "\n")
          PY

      - name: Start stack
        run: |
          cd deploy
          docker compose up -d --build postgres redis migrate api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Build integration test runner image
        run: |
          cd deploy
          docker compose build integration-tests

      - name: Run WebAuthn rate-limit tests (containerized)
        run: |
          cd deploy
          docker compose run --rm integration-tests pytest -q tests/integration/test_webauthn_security.py -k "rate_limited"

      - name: Dump compose logs on failure
        if: failure()
        run: |
          cd deploy
          docker compose logs --no-color --tail=200
