name: Feature request
description: Propose a new capability or major improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this template for net-new features and substantial enhancements.
        For bug reports, use the Bug report template.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user or operator problem are you trying to solve?
      placeholder: Describe the current gap and impact.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What should change?
      placeholder: API/UI/workflow behavior, data model, and expected UX.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and explicitly out of scope?
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches evaluated and why not chosen.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Observable criteria to consider this done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      options:
        - API
        - Worker
        - Adapter Framework
        - UI
        - Deploy/Compose
        - Docs
    validations:
      required: true

